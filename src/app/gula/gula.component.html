<h1 class="text-center">Számítás</h1>

<form [formGroup]="gulaForm" (ngSubmit)="startCalc()">

    <div>
        <label for="height" class="form-lable mt-3 text-center">Magasság</label>
        <input type="text" id="height" formControlName="height" class="form-control">
    </div>
    <div>
        <label for="baseSide" class="form-lable mt-3">Aloldal</label>
        <input type="text" id="baseSide" formControlName="baseSide" class="form-control">
    </div>
    <button class="btn btn-primary mt-3">Számít</button>

    @if (showVolume) {
    <div>
        <label for="volume" class="form-lable mt-3">Térfogat</label>
        <input type="text" id="volume" formControlName="volume" class="form-control">
    </div>
    }


</form>
